<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Dark Futuristic capstone project milestone directory.">
  <title>Dark Futuristic | Capstone Milestones</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: oklch(12% 0.025 270);
      --surface: oklch(18% 0.04 270);
      --text: oklch(92% 0.02 100);
      --muted: oklch(72% 0.035 250);
      --accent: oklch(90% 0.20 102);
      --line: oklch(52% 0.17 208);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 2rem;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
      background:
        linear-gradient(oklch(12% 0.025 270 / 0.88), oklch(12% 0.025 270 / 0.96)),
        repeating-linear-gradient(90deg, transparent 0 39px, oklch(52% 0.17 208 / 0.08) 40px),
        repeating-linear-gradient(0deg, transparent 0 39px, oklch(52% 0.17 208 / 0.08) 40px),
        var(--bg);
    }

    main {
      width: min(760px, 100%);
      padding: clamp(1.5rem, 4vw, 3rem);
      border: 1px solid var(--line);
      background: oklch(18% 0.04 270 / 0.9);
      box-shadow: 10px 10px 0 oklch(90% 0.20 102 / 0.18);
      clip-path: polygon(0 0, 95% 0, 100% 12%, 100% 100%, 5% 100%, 0 88%);
    }

    .eyebrow {
      margin: 0 0 .75rem;
      color: var(--accent);
      font: 700 .8rem/1.2 ui-monospace, SFMono-Regular, Menlo, monospace;
      letter-spacing: .14em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(2rem, 1.2rem + 4vw, 4rem);
      line-height: .95;
      text-transform: uppercase;
    }

    p { color: var(--muted); line-height: 1.7; }

    a {
      display: inline-flex;
      align-items: center;
      gap: .6rem;
      margin-top: 1rem;
      padding: .9rem 1.1rem;
      color: oklch(15% 0.03 270);
      background: var(--accent);
      text-decoration: none;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: .05em;
    }

    a:hover, a:focus-visible { transform: translate(-2px, -2px); box-shadow: 4px 4px 0 var(--line); }
    a:focus-visible { outline: 3px solid var(--text); outline-offset: 4px; }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Capstone Project Directory // 2026</p>
    <h1>Dark Futuristic</h1>
    <p>A cyberpunk-inspired video game discovery portal built incrementally across weekly milestones.</p>
    <a href="week02/index.html">Open Week 02 Token Blueprint →</a>
  </main>
</body>
</html>
